name: WordPress PHP lint

on:
  push:
    branches: [main]
    paths:
      - 'wordpress/**/*.php'
      - '.github/workflows/wordpress-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Lint WordPress PHP files
        shell: bash
        run: |
          set -euo pipefail
          find wordpress -type f -name '*.php' -print0 | xargs -0 -n1 php -l
