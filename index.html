<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VRC Italia Network</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="alternate" hreflang="it" href="https://www.vrcitalianetwork.it/it/" />
  <link rel="alternate" hreflang="en" href="https://www.vrcitalianetwork.it/en/" />
  <link rel="alternate" hreflang="x-default" href="https://www.vrcitalianetwork.it/en/" />
  <script>
    (function () {
      var supportedLanguages = {
        it: './it/',
        en: './en/'
      };

      var browserLanguages =
        Array.isArray(navigator.languages) && navigator.languages.length
          ? navigator.languages
          : [navigator.language || navigator.userLanguage].filter(Boolean);

      var target = './en/';

      for (var i = 0; i < browserLanguages.length; i++) {
        var language = String(browserLanguages[i]).toLowerCase().split(/[-_]/)[0];

        if (supportedLanguages[language]) {
          target = supportedLanguages[language];
          break;
        }
      }

      window.location.replace(target);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=./en/" />
  </noscript>
</head>
<body>
  <p>Redirecting to VRC Italia Network. <a href="./en/">Continue to the English version</a>.</p>
</body>
</html>
